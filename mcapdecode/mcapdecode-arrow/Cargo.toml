[package]
name = "mcapdecode-arrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
readme = "README.md"
description = "Arrow conversion utilities built on top of mcapdecode-core schemas and values."

[dependencies]
mcapdecode-core.workspace = true
mcapdecode-reader = { workspace = true, optional = true }
arrow.workspace = true
thiserror.workspace = true

[features]
# Adds RecordBatch reading on top of mcapdecode-reader. Off by default so the
# conversion utilities can be used without pulling in the reader.
reader = ["dep:mcapdecode-reader"]
