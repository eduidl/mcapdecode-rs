[package]
name = "mcapbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Fixture generation is benchmark-only work. Keep its verification suite opt-in so a
# normal workspace test run does not materialize large MCAP files.
fixture-tests = []

[[bin]]
name = "mcapbench"
path = "src/main.rs"

[[test]]
name = "generate"
required-features = ["fixture-tests"]

[[test]]
name = "reader_alloc_budget"
required-features = ["fixture-tests"]

[[test]]
name = "reader_contract"
required-features = ["fixture-tests"]

[[test]]
name = "roundtrip"
required-features = ["fixture-tests"]

[dependencies]
clap.workspace = true
bytes = "1.11.1"
mcap.workspace = true
prost = "0.14.3"
prost-reflect = "0.16.3"
prost-types = "0.14.3"

[dev-dependencies]
dhat.workspace = true
# The reader regression contracts live here rather than in `mcapdecode` because they need
# generated fixtures, and this crate is `publish = false`.
mcapdecode = { workspace = true, features = ["ros2idl"] }
mcapdecode-core.workspace = true
mcapdecode-protobuf.workspace = true
mcapdecode-ros2idl.workspace = true
mcapdecode-ros2msg.workspace = true
