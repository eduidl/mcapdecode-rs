[project]
name = "mcapdecode-python-bench"
version = "0.0.0"
description = "Manual end-to-end benchmarks for mcapdecode Python bindings."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=15",
  "rosbags>=0.11.1,<0.12",
]

[project.optional-dependencies]
dev = ["maturin>=1.10,<2"]
test = ["pytest>=8"]
