default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # Nightly is required for the unstable options in rustfmt.toml (matches CI).
      - id: cargo-fmt
        name: cargo +nightly fmt
        entry: cargo +nightly fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # Clippy is slow, so run it only before pushing.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
