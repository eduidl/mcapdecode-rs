[workspace]
members = ["dev/*", "mcapdecode/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/eduidl/mcapdecode-rs"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md"]

[workspace.dependencies]
# Unpublished dev crate, so it carries no version requirement.
mcapbench = { path = "dev/mcapbench" }
mcapdecode = { path = "mcapdecode/mcapdecode", version = "=0.5.1" }
mcapdecode-arrow = { path = "mcapdecode/mcapdecode-arrow", version = "=0.5.1" }
mcapdecode-core = { path = "mcapdecode/mcapdecode-core", version = "=0.5.1" }
mcapdecode-protobuf = { path = "mcapdecode/mcapdecode-protobuf", version = "=0.5.1" }
# Decoder features are chosen by each dependent rather than inherited from the
# reader's own defaults.
mcapdecode-reader = { path = "mcapdecode/mcapdecode-reader", version = "=0.5.1", default-features = false }
mcapdecode-ros2-common = { path = "mcapdecode/mcapdecode-ros2-common", version = "=0.5.1" }
mcapdecode-ros2idl = { path = "mcapdecode/mcapdecode-ros2idl", version = "=0.5.1" }
mcapdecode-ros2msg = { path = "mcapdecode/mcapdecode-ros2msg", version = "=0.5.1" }

arrow = { version = "57.3.0", default-features = false }
clap = { version = "4.5.58", features = ["derive"] }
thiserror = "2.0.18"
criterion = "0.5.1"
dhat = "0.3.3"

[workspace.metadata.release]
allow-branch = ["main"]
shared-version = true
tag-prefix = ""
